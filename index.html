<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0c1016" />
  <title>XAUUSD Desk</title>
  <style>
    :root {
      --bg: #0c1016;
      --card: #141a22;
      --line: #243040;
      --ink: #e8edf4;
      --mute: #8b97a8;
      --gold: #e0b13a;
      --up: #3dd68c;
      --dn: #f36565;
      --wait: #c9a227;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--bg); color: var(--ink); font-family: "Segoe UI", system-ui, sans-serif; }
    body { min-height: 100vh; padding: 12px 12px calc(18px + env(safe-area-inset-bottom)); }
    .wrap { max-width: 1100px; margin: 0 auto; }
    header {
      display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
      padding: 6px 2px 12px;
    }
    header h1 { font-size: 18px; letter-spacing: .08em; font-weight: 700; }
    header h1 span { color: var(--gold); }
    .live { font-size: 11px; color: var(--mute); display: flex; align-items: center; gap: 6px; }
    .live i { width: 8px; height: 8px; border-radius: 50%; background: #555; display: inline-block; }
    .live.on i { background: var(--up); box-shadow: 0 0 8px var(--up); }
    .live.bad i { background: var(--dn); }
    .price-row {
      background: var(--card); border: 1px solid var(--line); border-radius: 14px;
      padding: 16px 18px; display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 22px;
    }
    .px { font-variant-numeric: tabular-nums; font-size: 40px; font-weight: 700; letter-spacing: -1px; line-height: 1; transition: color .2s; }
    .chg { font-variant-numeric: tabular-nums; font-size: 16px; font-weight: 700; }
    .chg.up { color: var(--up); } .chg.dn { color: var(--dn); }
    .meta { color: var(--mute); font-size: 12px; line-height: 1.45; }
    .meta b { color: var(--ink); font-weight: 600; }
    .call {
      margin-top: 12px; border-radius: 14px; padding: 16px 18px; border: 1px solid var(--line);
      background: #182018;
    }
    .call.buy { background: #10261c; border-color: #1e6b46; }
    .call.sell { background: #2a1418; border-color: #7a2d33; }
    .call.wait { background: #241e10; border-color: #6b5420; }
    .call .tag {
      display: inline-block; font-size: 13px; font-weight: 800; letter-spacing: .14em;
      padding: 4px 10px; border-radius: 999px; margin-bottom: 8px;
    }
    .call.buy .tag { background: var(--up); color: #062; }
    .call.sell .tag { background: var(--dn); color: #3a0008; }
    .call.wait .tag { background: var(--wait); color: #2a1e00; }
    .call h2 { font-size: 22px; margin-bottom: 6px; }
    .call p, .why li { font-size: 14px; line-height: 1.45; color: #d5dbe6; }
    .lvls { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 12px 0 4px; }
    .lvls div { background: rgba(0,0,0,.25); border-radius: 10px; padding: 8px 10px; }
    .lvls small { display: block; color: var(--mute); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
    .lvls b { font-variant-numeric: tabular-nums; font-size: 14px; }
    .why { margin: 10px 0 0 18px; }
    .tools { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
    .tools button {
      background: var(--card); color: var(--ink); border: 1px solid var(--line);
      border-radius: 999px; padding: 8px 14px; font: 700 13px inherit; cursor: pointer;
    }
    .tools button.on { background: var(--gold); color: #1a1404; border-color: var(--gold); }
    .tools button:disabled { opacity: .55; cursor: wait; }
    .px.flash { color: var(--gold); }
    .chart-box { position: relative; user-select: none; }
    canvas { width: 100%; height: 420px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; display: block; touch-action: none; cursor: grab; }
    canvas.drawing { cursor: crosshair; }
    canvas.erasing { cursor: pointer; }
    canvas.axis-y { cursor: ns-resize; }
    canvas.axis-x { cursor: ew-resize; }
    canvas.grabbing { cursor: grabbing; }
    .zoom {
      position: absolute; top: 10px; right: 78px; display: flex; gap: 6px; z-index: 2;
    }
    .zoom button, .draw button {
      border-radius: 10px; border: 1px solid var(--line);
      background: rgba(20,26,34,.88); color: var(--ink); font: 700 12px inherit;
      cursor: pointer; line-height: 1;
    }
    .zoom button { width: 34px; height: 34px; font-size: 16px; }
    .zoom button:active, .draw button:active { background: var(--gold); color: #1a1404; }
    .draw { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 10px; }
    .draw button { padding: 8px 12px; border-radius: 999px; background: var(--card); }
    .draw button.on { background: var(--gold); color: #1a1404; border-color: var(--gold); }
    .hint { font-size: 11px; color: var(--mute); margin: 6px 2px 0; }
    .feeds { margin-top: 10px; font-size: 12px; color: var(--mute); line-height: 1.5; }
    .feeds b { color: var(--ink); }
    .warn { margin-top: 12px; font-size: 12px; color: #b9a56a; line-height: 1.5; }
    details { margin-top: 10px; color: var(--mute); font-size: 12px; }
    details summary { cursor: pointer; color: var(--gold); }
    details p { margin-top: 6px; line-height: 1.5; }
    .coach {
      margin-top: 12px; background: var(--card); border: 1px solid var(--line);
      border-radius: 14px; padding: 14px 16px;
    }
    .coach h3 { font-size: 13px; letter-spacing: .1em; color: var(--gold); margin-bottom: 8px; }
    .coach textarea {
      width: 100%; min-height: 72px; resize: vertical; background: #0c1016; color: var(--ink);
      border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font: 14px inherit;
    }
    .coach .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .coach .row button {
      background: var(--gold); color: #1a1404; border: 0; border-radius: 999px;
      padding: 8px 14px; font: 700 13px inherit; cursor: pointer;
    }
    .coach .row button.ghost, .coach label.ghost {
      background: var(--card); color: var(--ink); border: 1px solid var(--line);
    }
    .coach .row button:disabled { opacity: .55; cursor: wait; }
    .coach .st { font-size: 11px; color: var(--mute); margin-top: 8px; }
    .coach ul { margin: 8px 0 0 18px; font-size: 13px; line-height: 1.45; color: #d5dbe6; }
    .coach .dates { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
    .coach .dates label { flex: 1; min-width: 90px; font-size: 11px; color: var(--mute); }
    .coach .dates input, .trade input, .trade select {
      width: 100%; margin-top: 4px; background: #0c1016; color: var(--ink);
      border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: 14px inherit;
    }
    .trade { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 8px; margin: 8px 0; }
    .trade label { font-size: 11px; color: var(--mute); }
    .dropzone {
      margin-top: 8px; border: 1px dashed var(--line); border-radius: 10px; padding: 16px 12px;
      text-align: center; color: var(--mute); font-size: 13px; cursor: pointer;
    }
    .dropzone.over { border-color: var(--gold); color: var(--gold); }
    .thumbs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .thumbs img { width: 72px; height: 72px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); }
    .coach .reply {
      margin-top: 10px; white-space: pre-wrap; font-size: 14px; line-height: 1.5;
      color: #d5dbe6; background: rgba(0,0,0,.22); border-radius: 10px; padding: 10px 12px;
    }
    .coach .reply:empty { display: none; }
    @media (max-width: 640px) {
      .px { font-size: 32px; }
      .lvls { grid-template-columns: 1fr 1fr; }
      canvas { height: 320px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>XAU<span>USD</span> DESK</h1>
      <div class="live" id="live"><i></i> <span id="liveTxt">đang nối feed…</span></div>
    </header>

    <div class="price-row">
      <div>
        <div class="px" id="px">—</div>
        <div class="chg" id="chg">XAUUSD · Swissquote / MT5</div>
      </div>
    </div>

    <div class="call wait" id="call">
      <div class="tag" id="callTag">WAIT</div>
      <h2 id="callTitle">Chưa đủ nến để gọi lệnh</h2>
      <p id="callLead">Đang lấy giá spot và nến. Đây là bàn luật, không phải lệnh sàn.</p>
      <div class="lvls" id="lvls" hidden></div>
      <ul class="why" id="why"></ul>
    </div>

    <div class="tools" id="symRow">
      <button type="button" data-sym="XAUUSD" class="on">XAUUSD</button>
      <button type="button" data-sym="BTCUSD">BTC/USD</button>
      <button type="button" data-sym="USOIL">USOil</button>
    </div>
    <div class="tools">
      <button type="button" data-tf="5m">5m</button>
      <button type="button" data-tf="15m" class="on">15m</button>
      <button type="button" data-tf="1h">1h</button>
      <button type="button" data-tf="4h">4h</button>
      <button type="button" data-tf="1d">1D</button>
      <button type="button" data-tf="1w">1W</button>
      <button type="button" id="btnRefresh">Refresh</button>
    </div>
    <div class="draw" id="drawBar">
      <button type="button" data-tool="pan" class="on">Pan</button>
      <button type="button" data-tool="line">Line</button>
      <button type="button" data-tool="fib">Fib</button>
      <button type="button" data-tool="hline">HLine</button>
      <button type="button" data-tool="rect">Khung</button>
      <button type="button" data-tool="del">Del</button>
      <button type="button" id="btnUndo">Undo</button>
      <button type="button" id="btnClearDraw">Xóa kẻ</button>
    </div>
    <div class="chart-box">
      <div class="zoom" aria-label="Thu phóng chart">
        <button type="button" id="btnZoomIn" title="Phóng">＋</button>
        <button type="button" id="btnZoomOut" title="Thu">－</button>
        <button type="button" id="btnZoomReset" title="Reset">⌂</button>
      </div>
      <canvas id="chart" width="1100" height="420"></canvas>
    </div>

    <div class="coach" id="diaryBox">
      <h3>NHẬT KÝ</h3>
      <div class="dates">
        <label>Ngày<input id="noteDay" type="date" /></label>
      </div>
      <textarea id="noteIn" maxlength="2000" placeholder="Nhận định ngày này. Thả ảnh chart vào ô dưới."></textarea>
      <div class="trade">
        <label>Lệnh
          <select id="trSide">
            <option value="">—</option>
            <option value="BUY">BUY</option>
            <option value="SELL">SELL</option>
          </select>
        </label>
        <label>Vào<input id="trEntry" type="number" step="0.01" placeholder="entry" /></label>
        <label>TP<input id="trTp" type="number" step="0.01" placeholder="take profit" /></label>
        <label>Cắt lỗ<input id="trSl" type="number" step="0.01" placeholder="cut" /></label>
      </div>
      <div class="dropzone" id="dropZone">Thả ảnh chart vào đây · hoặc bấm để chọn<input type="file" accept="image/*" multiple hidden id="chartFiles" /></div>
      <div class="thumbs" id="thumbs"></div>
      <div class="row">
        <button type="button" id="btnSubmit">Submit</button>
        <button type="button" class="ghost" id="btnAdvise">Tóm nét</button>
        <button type="button" class="ghost" id="btnPlay">Ví dụ vào lệnh</button>
      </div>
      <div class="st" id="noteSt">Ngày · chữ · ảnh · lệnh (vào / TP / cắt). Submit lưu. Tóm nét đọc sổ lệnh. Dùng 4180.</div>
      <ul id="noteList"></ul>
      <div class="reply" id="adviseOut"></div>
    </div>
  </div>
<script>
(function () {
  var tf = "15m";
  var sym = "XAUUSD";
  var SYM_LAB = { XAUUSD: "XAUUSD", BTCUSD: "BTC/USD", USOIL: "USOil" };
  var bars = [];
  var spot = null;
  var paxg = null;
  var fx = null;
  var fxSrc = "";
  var barSrc = "";
  var spotAt = 0;
  var paxgAt = 0;
  var fxAt = 0;
  var barAt = 0;
  var err = "";
  var tPrice = 0, tBar = 0;
  var lastShown = null;
  var refreshing = false;
  var visN = 80;
  var viewRight = -1;
  var yLo = null;
  var yHi = null;
  var tool = "pan";
  var drawings = [];
  var sel = -1;
  var draft = null;
  var drag = null;
  var hover = null;
  var lastCall = null;
  var forecast = null;
  var chartReads = [];
  var layout = { left: 10, right: 72, top: 12, bot: 28, w: 0, h: 0, lo: 0, hi: 1, start: 0, end: 0, cw: 1 };
  function apiBase() {
    if (window.FX_PIPE) return window.FX_PIPE.replace(/\/$/, "");
    if (location.hostname === "127.0.0.1" || location.hostname === "localhost") {
      if (location.port === "4180") return "";
      return "http://127.0.0.1:4180";
    }
    return "https://xauusd-fx-pipe.tranchaungoclong.workers.dev";
  }
  var cv = document.getElementById("chart");
  var ctx = cv.getContext("2d");

  function $(id) { return document.getElementById(id); }
  function n2(x) { return x == null || isNaN(x) ? "—" : Number(x).toFixed(2); }
  function ago(ms) {
    if (!ms) return "—";
    var s = Math.max(0, Math.round((Date.now() - ms) / 1000));
    if (s < 60) return s + "s";
    return Math.round(s / 60) + "p";
  }
  function clock(ms) {
    if (!ms) return "—";
    var d = new Date(ms);
    function p(n) { return (n < 10 ? "0" : "") + n; }
    return p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
  }
  function tfLabel() {
    if (tf === "1d") return "1D";
    if (tf === "1w") return "1W";
    return tf;
  }
  function interval() {
    if (tf === "5m") return "5m";
    if (tf === "1h") return "1h";
    if (tf === "4h") return "4h";
    if (tf === "1d") return "1d";
    if (tf === "1w") return "1w";
    return "15m";
  }
  function getJson(url) {
    return fetch(url, { cache: "no-store" }).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    });
  }
  function showPx(v) {
    var el = $("px");
    var s = n2(v);
    if (lastShown != null && s !== lastShown) {
      el.classList.remove("flash");
      void el.offsetWidth;
      el.classList.add("flash");
      setTimeout(function () { el.classList.remove("flash"); }, 700);
    }
    lastShown = s;
    el.textContent = s;
  }

  function ema(arr, period) {
    var k = 2 / (period + 1);
    var out = new Array(arr.length);
    var seed = 0, n = 0, prev = null;
    for (var i = 0; i < arr.length; i++) {
      var v = arr[i];
      if (i < period) {
        seed += v; n++;
        if (n === period) { prev = seed / period; out[i] = prev; }
        else out[i] = null;
      } else {
        prev = v * k + prev * (1 - k);
        out[i] = prev;
      }
    }
    return out;
  }
  function rsi(closes, period) {
    var out = new Array(closes.length).fill(null);
    if (closes.length <= period) return out;
    var g = 0, l = 0;
    for (var i = 1; i <= period; i++) {
      var d = closes[i] - closes[i - 1];
      if (d >= 0) g += d; else l -= d;
    }
    g /= period; l /= period;
    out[period] = l === 0 ? 100 : 100 - 100 / (1 + g / l);
    for (var j = period + 1; j < closes.length; j++) {
      var dj = closes[j] - closes[j - 1];
      var gj = dj > 0 ? dj : 0;
      var lj = dj < 0 ? -dj : 0;
      g = (g * (period - 1) + gj) / period;
      l = (l * (period - 1) + lj) / period;
      out[j] = l === 0 ? 100 : 100 - 100 / (1 + g / l);
    }
    return out;
  }
  function atr(bs, period) {
    var out = new Array(bs.length).fill(null);
    if (bs.length <= period) return out;
    var acc = 0;
    for (var i = 1; i <= period; i++) {
      var tr = Math.max(
        bs[i].h - bs[i].l,
        Math.abs(bs[i].h - bs[i - 1].c),
        Math.abs(bs[i].l - bs[i - 1].c)
      );
      acc += tr;
    }
    var prev = acc / period;
    out[period] = prev;
    for (var j = period + 1; j < bs.length; j++) {
      var trj = Math.max(
        bs[j].h - bs[j].l,
        Math.abs(bs[j].h - bs[j - 1].c),
        Math.abs(bs[j].l - bs[j - 1].c)
      );
      prev = (prev * (period - 1) + trj) / period;
      out[j] = prev;
    }
    return out;
  }

  function decide() {
    if (bars.length < 30) {
      return { side: "WAIT", title: "Chưa đủ nến", lead: "Cần ≥ 30 nến " + tf + " mới gọi được.", why: ["Feed nến chưa đủ.", "Không bịa hướng."], lvls: null, weak: true };
    }
    var closes = bars.map(function (b) { return b.c; });
    var e9 = ema(closes, 9);
    var e21 = ema(closes, 21);
    var rs = rsi(closes, 14);
    var at = atr(bars, 14);
    var i = bars.length - 1;
    var c = closes[i], a9 = e9[i], a21 = e21[i], r = rs[i], a = at[i];
    var refPx = paxg != null ? paxg : spot;
    var livePx = fx != null ? fx : refPx;
    var spread = (livePx != null && refPx != null) ? Math.abs(livePx - refPx) : 0;
    var weakSpread = spread > 8;
    var why = [];
    why.push("EMA9 " + n2(a9) + " vs EMA21 " + n2(a21) + (a9 > a21 ? " — trend lên" : a9 < a21 ? " — trend xuống" : " — dẹt"));
    why.push("RSI14 = " + n2(r) + (r > 70 ? " — già mua" : r < 30 ? " — già bán" : " — chưa cực"));
    why.push("ATR14 = " + n2(a) + (weakSpread ? " · FX vs PAXG lệch $" + n2(spread) + " — call yếu" : " · FX vs PAXG $" + n2(spread)));

    var side = "WAIT";
    var title = "WAIT — chưa rõ sóng";
    var lead = "Không đủ điều kiện BUY/SELL trên khung " + tf + ".";
    if (a9 != null && a21 != null && r != null && a != null) {
      var up = a9 > a21 && c > a21;
      var dn = a9 < a21 && c < a21;
      if (r > 70 || r < 30) {
        title = "WAIT — RSI cực, dễ đảo";
        lead = "Sóng đã đi xa. Đợi RSI về 42–68 (mua) hoặc 32–58 (bán).";
      } else if (up && r >= 42 && r <= 68 && c >= a9) {
        side = "BUY";
        title = "BUY — trend lên, RSI còn chỗ";
        lead = "Nhận định long trên " + tf + ". Không phải lệnh sàn. Cắt nếu gãy dưới SL.";
      } else if (dn && r >= 32 && r <= 58 && c <= a9) {
        side = "SELL";
        title = "SELL — trend xuống, RSI còn chỗ";
        lead = "Nhận định short trên " + tf + ". Không phải lệnh sàn. Cắt nếu phá trên SL.";
      } else {
        lead = "Trend và RSI chưa cùng hướng. Đứng ngoài.";
      }
    }
    if (weakSpread && side !== "WAIT") {
      lead += " FX và PAXG đang lệch — giảm size hoặc WAIT.";
    }
    var lvls = null;
    if (side !== "WAIT" && a) {
      var sl = side === "BUY" ? c - 1.4 * a : c + 1.4 * a;
      var rUnit = Math.abs(c - sl);
      var tp1 = side === "BUY" ? c + 1.5 * rUnit : c - 1.5 * rUnit;
      var tp2 = side === "BUY" ? c + 2.5 * rUnit : c - 2.5 * rUnit;
      lvls = { entry: c, sl: sl, tp1: tp1, tp2: tp2 };
    }
    return { side: side, title: title, lead: lead, why: why, lvls: lvls, weak: weakSpread, e9: e9, e21: e21 };
  }

  function paintCall(d) {
    var box = $("call");
    box.className = "call " + d.side.toLowerCase();
    $("callTag").textContent = d.side;
    $("callTitle").textContent = d.title;
    $("callLead").textContent = d.lead;
    var ul = $("why");
    ul.innerHTML = d.why.map(function (w) { return "<li>" + w + "</li>"; }).join("");
    var lv = $("lvls");
    if (!d.lvls) { lv.hidden = true; lv.innerHTML = ""; return; }
    lv.hidden = false;
    lv.innerHTML =
      "<div><small>Entry</small><b>" + n2(d.lvls.entry) + "</b></div>" +
      "<div><small>SL</small><b>" + n2(d.lvls.sl) + "</b></div>" +
      "<div><small>TP1</small><b>" + n2(d.lvls.tp1) + "</b></div>" +
      "<div><small>TP2</small><b>" + n2(d.lvls.tp2) + "</b></div>";
  }

  function barMs() {
    if (bars.length < 2) return 15 * 60 * 1000;
    var d = bars[bars.length - 1].t - bars[bars.length - 2].t;
    return d > 0 ? d : 15 * 60 * 1000;
  }
  function followRight() {
    return Math.max(0, bars.length - 1) + visN * 0.22;
  }
  function rightIdx() {
    if (viewRight < 0 || !bars.length) return followRight();
    return viewRight;
  }
  function visWindow() {
    var n = Math.max(12, visN);
    var last = Math.max(0, bars.length - 1);
    var end = rightIdx();

      fxAt = Date.now();

  var dropEl = $("dropZone");
  dropEl.addEventListener("click", function () { $("chartFiles").click(); });
  ["dragenter", "dragover"].forEach(function (n) {
    dropEl.addEventListener(n, function (e) { e.preventDefault(); dropEl.classList.add("over"); });
  });
  dropEl.addEventListener("dragleave", function () { dropEl.classList.remove("over"); });
  dropEl.addEventListener("drop", function (e) {
    e.preventDefault();
    dropEl.classList.remove("over");
    addFiles(e.dataTransfer && e.dataTransfer.files);
  });
  $("chartFiles").addEventListener("change", function (ev) {
    addFiles(ev.target.files);
    ev.target.value = "";
  });
  $("btnSubmit").addEventListener("click", function () {
    var text = ($("noteIn").value || "").trim();
    var day = $("noteDay").value || todayISO();
    var btn = $("btnSubmit");
    btn.disabled = true;
    $("noteSt").textContent = "Đang lưu nhật ký…";
    var side = $("trSide").value;
    var trade = null;
    if (side === "BUY" || side === "SELL") {
      trade = {
        side: side,
        entry: $("trEntry").value,
        tp: $("trTp").value,
        sl: $("trSl").value
      };
    }
    if (!text && !pendingPhotos.length && !trade) { $("noteSt").textContent = "Ghi chữ, thả ảnh, hoặc điền lệnh."; return; }
    postJson(apiBase() + "/api/notes", {
      day: day,
      text: text,
      photos: pendingPhotos.map(function (p) { return p.dataUrl; }),
      trade: trade
    }).then(function (r) {
      if (!r.j || !r.j.ok) throw new Error((r.j && r.j.err && r.j.err[0]) || "not found");
      days = r.j.days || [];
      lastAdvise = r.j.lastAdvise || lastAdvise;
      $("noteIn").value = "";
      $("trSide").value = "";
      $("trEntry").value = "";
      $("trTp").value = "";
      $("trSl").value = "";
      pendingPhotos = [];
      paintThumbs();
      $("noteSt").textContent = "Đã lưu nhật ký " + day;
      paintNotes();
    }).catch(function (e) {
      $("noteSt").textContent = String(e.message || e) + " · dùng http://127.0.0.1:4180/";
    }).then(function () { btn.disabled = false; });
  });
  $("btnAdvise").addEventListener("click", function () {
    var btn = $("btnAdvise");
    btn.disabled = true;
    $("noteSt").textContent = "Đang tóm nét mày kẻ…";
    var last = bars.length ? bars[bars.length - 1] : null;
    postJson(apiBase() + "/api/advise", {
      tf: tf,
      fx: fx,
      lastBar: last ? { h: last.h, l: last.l, c: last.c } : null,
      chartReads: chartReads.map(function (c) { return c.name || c; }),
      marks: drawings.filter(function (o) { return !o.auto; }).map(function (o) {
        if (o.type === "hline") return { type: "hline", p: o.p };
        if (o.type === "line") return { type: "line", p1: o.p1, p2: o.p2 };
        if (o.type === "fib") return { type: "fib", hi: Math.max(o.p1, o.p2), lo: Math.min(o.p1, o.p2) };
        if (o.type === "rect") return { type: "khung", p1: o.p1, p2: o.p2 };
        return { type: o.type };
      }),
      images: chartReads.slice(-4).map(function (c) {
        return { mime: c.mime || "image/png", data: c.dataUrl || "" };
      }).filter(function (im) { return im.data; })
    }).then(function (r) {
      if (!r.j || !r.j.ok) throw new Error((r.j && r.j.err && r.j.err[0]) || "advise fail");
      lastAdvise = r.j.advise || "";
      if (r.j.days) days = r.j.days;
      $("noteSt").textContent = "Tóm nét của mày · không phải lệnh sàn";
      paintNotes();
      var path = r.j.path || {};
      if ((!drawings.filter(function (o) { return !o.auto; }).length) && (path.path || path.hlines)) stampForecast(path);
    }).catch(function (e) {
      $("noteSt").textContent = String(e.message || e);
    }).then(function () { btn.disabled = false; });
  });
  $("btnClearDraw").addEventListener("click", function () {
    drawings = []; draft = null; sel = -1; forecast = null; render();
  });
  loadNotes();
  function setTool(name) {
    if (name !== "pan" && name === tool) name = "pan";
    tool = name;
    draft = null;
    if (name !== "del") sel = -1;
    cv.classList.toggle("drawing", name !== "pan" && name !== "del");
    cv.classList.toggle("erasing", name === "del");
    document.querySelectorAll("[data-tool]").forEach(function (b) {
      b.classList.toggle("on", b.getAttribute("data-tool") === name);
    });
    render();
  }
  document.querySelectorAll("[data-tool]").forEach(function (btn) {
    btn.addEventListener("click", function () { setTool(btn.getAttribute("data-tool")); });
  });
  $("btnUndo").addEventListener("click", function () {
    if (sel >= 0) dropSel();
    else { drawings.pop(); sel = -1; render(); }
  });

  function setZoom(n, anchorX) {
    var cap = Math.max(12, bars.length || 200);
    var old = visN;
    visN = Math.max(12, Math.min(n, cap));
    if (anchorX != null && bars.length) {
      var i = xToIdx(anchorX);
      var end = rightIdx();
      var frac = (i - (end - old + 1)) / old;
      viewRight = i + visN * (1 - frac) - 1;
    }
    render();
  }
  $("btnZoomIn").addEventListener("click", function () { setZoom(Math.round(visN * 0.55)); });
  $("btnZoomOut").addEventListener("click", function () { setZoom(Math.round(visN * 1.9)); });
  $("btnZoomReset").addEventListener("click", function () {
    visN = 80; viewRight = -1; yLo = null; yHi = null; render();
  });

  function pt(e) {
    var r = cv.getBoundingClientRect();
    var src = (e.touches && e.touches[0]) || e;
    return { x: src.clientX - r.left, y: src.clientY - r.top };
  }
  function startDrag(e) {
    if (bars.length < 2) return;
    var p = pt(e);
    var z = zone(p.x, p.y);
    if (z === "plot") {
      var hit = hitDraw(p);
      if (tool === "del") {
        if (hit >= 0) { sel = hit; dropSel(); }
        return;
      }
      if (hit >= 0 && (tool === "pan" || sel === hit)) {
        if (sel === hit) dropSel();
        else { sel = hit; render(); }
        return;
      }
      if (tool !== "pan") {
        sel = -1;
        if (tool === "hline") {
          drawings.push({ type: "hline", p: yToP(p.y) });
          sel = drawings.length - 1;
          render();
          return;
        }
        draft = { type: tool, t1: xToT(p.x), p1: yToP(p.y), t2: xToT(p.x), p2: yToP(p.y) };
        drag = { kind: "draw", x: p.x, y: p.y };
        render();
        return;
      }
    }
    drag = {
      kind: z === "price" ? "price" : z === "time" ? "time" : "pan",
      x: p.x, y: p.y,
      visN: visN, viewRight: rightIdx(),
      lo: layout.lo, hi: layout.hi, h: layout.h, cw: layout.cw
    };
    cv.classList.add("grabbing");
  }
  function moveDrag(e) {
    var p = pt(e);
    hover = p;
    if (!drag) {
      var z0 = zone(p.x, p.y);
      cv.classList.toggle("axis-y", tool === "pan" && z0 === "price");
      cv.classList.toggle("axis-x", tool === "pan" && z0 === "time");
      cv.classList.toggle("erasing", tool === "del" || (z0 === "plot" && hitDraw(p) >= 0));
      if (lastCall) paintChart(lastCall);
      return;
    }
    var dx = p.x - drag.x;
    var dy = p.y - drag.y;
    if (drag.kind === "draw" && draft) {
      draft.t2 = xToT(p.x);
      draft.p2 = yToP(p.y);
      render();
      return;
    }
    if (drag.kind === "price") {
      var f = Math.pow(1.012, dy);
      var mid = (drag.lo + drag.hi) / 2;
      var rng = Math.max(0.5, (drag.hi - drag.lo) * f);
      yLo = mid - rng / 2;
      yHi = mid + rng / 2;
    } else if (drag.kind === "time") {
      var f2 = Math.pow(1.012, -dx);
      visN = Math.max(12, Math.min(bars.length, drag.visN * f2));
    } else {
      viewRight = drag.viewRight - dx / (drag.cw || 1);
      var plotH = (drag.h - layout.top - layout.bot) || 1;
      var dP = dy * ((drag.hi - drag.lo) / plotH);
      yLo = drag.lo + dP;
      yHi = drag.hi + dP;
    }
    render();
  }
  function endDrag(e) {
    if (drag && drag.kind === "draw" && draft) {
      var p = e ? pt(e) : hover;
      if (p) { draft.t2 = xToT(p.x); draft.p2 = yToP(p.y); }
      if (Math.abs(draft.p1 - draft.p2) > 0.05 || Math.abs(draft.t1 - draft.t2) > 1) {
        drawings.push(draft);
        sel = drawings.length - 1;
      }
      draft = null;
    }
    drag = null;
    cv.classList.remove("grabbing");
    render();
  }
  cv.addEventListener("mousedown", startDrag);
  window.addEventListener("mousemove", moveDrag);
  window.addEventListener("mouseup", endDrag);
  cv.addEventListener("touchstart", function (e) { e.preventDefault(); startDrag(e); }, { passive: false });
  window.addEventListener("touchmove", function (e) { if (drag) { e.preventDefault(); moveDrag(e); } }, { passive: false });
  window.addEventListener("touchend", endDrag);
  cv.addEventListener("wheel", function (e) {
    e.preventDefault();
    var z = zone(e.offsetX, e.offsetY);
    if (z === "price") {
      var f = e.deltaY < 0 ? 0.9 : 1.1;
      var mid = (yLo + yHi) / 2;
      var rng = Math.max(0.5, (yHi - yLo) * f);
      yLo = mid - rng / 2;
      yHi = mid + rng / 2;
      render();
    } else {
      setZoom(e.deltaY < 0 ? Math.round(visN * 0.85) : Math.round(visN * 1.18), e.offsetX);
    }
  }, { passive: false });
  cv.addEventListener("dblclick", function () {
    visN = 80; viewRight = -1; yLo = null; yHi = null; render();
  });
  window.addEventListener("resize", function () { render(); });
  window.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { draft = null; sel = -1; setTool("pan"); render(); }
    if (e.key === "Delete" || e.key === "Backspace") { dropSel(); }
    if ((e.key === "z" || e.key === "Z") && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      if (sel >= 0) dropSel();
      else { drawings.pop(); render(); }
    }
  });

  function applyPlaybook(book) {
    if (!book || !bars.length) return;
    var x = book.xauusd || {};
    var sell = x.sell || {};
    var entry = sell.entry;
    var tp = (sell.tp && sell.tp[0]) || null;
    var sl = sell.sl || 15;
    if (!(entry > 0) || !(tp > 0)) {
      $("noteSt").textContent = "Playbook thiếu SELL entry/TP";
      return;
    }
    var tNow = bars[bars.length - 1].t;
    var step = barMs();
    var tA = tNow - 6 * step;
    var tB = tNow + 10 * step;
    drawings = drawings.filter(function (o) { return !o.auto; });
    drawings.push({ type: "hline", p: entry, auto: true });
    drawings.push({ type: "hline", p: tp, auto: true });
    drawings.push({ type: "hline", p: entry + sl, auto: true });
    drawings.push({ type: "rect", t1: tA, p1: entry + sl, t2: tB, p2: tp, auto: true });
    lastAdvise = "Ví dụ 1 lệnh — SELL " + entry + " · cắt " + (entry + sl) + " · TP " + tp + "\nKhông phải lệnh sàn. BUY 4250 không vẽ trừ khi giá ổn định trên đó.";
    $("noteSt").textContent = "1 lệnh SELL · không phải lệnh sàn";
    paintNotes();
    render();
  }
  $("btnPlay").addEventListener("click", function () {
    fetch("playbook.json", { cache: "no-store" }).then(function (r) {
      if (!r.ok) throw new Error("playbook missing");
      return r.json();
    }).then(applyPlaybook).catch(function (e) {
      $("noteSt").textContent = String(e.message || e);
    });
  });

  refreshNow();
  tPrice = setInterval(tickPrice, 5000);
  tBar = setInterval(tickBars, 20000);
})();
</script>
</body>
</html>
